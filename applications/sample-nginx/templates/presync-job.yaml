apiVersion: batch/v1
kind: Job

metadata:
  name: "{{ include "sample-nginx.fullname" . }}-presync"

  annotations:
    argocd.argoproj.io/hook: PreSync

spec:
  template:
    spec:
      restartPolicy: Never

      containers:
      - name: presync
        image: busybox

        command:
        - sh
        - -c
        - |
          echo "PreSync started"
          sleep 120
          echo "PreSync finished"
