# Bootstrap Argo CD ApplicationSets
# Add ApplicationSet manifests in this file.
---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: applicationsets
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/isw-Prashant/gitops-platform-lab.git
    targetRevision: HEAD
    path: applicationsets/

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true